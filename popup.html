<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #textInput {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
        }

        /* 目标列表：不再有单独的"发送"按钮，按钮上直接显示配置名称，点击即发送。
           保留按钮外观；用 <button> 实现是为了在元素找不到时能真正禁用（原生 disabled） */
        #sendList {
            list-style: none;   /* 去掉列表圆点 */
            margin: 0;
            padding: 0;
        }

        #sendList li + li {
            margin-top: 6px;    /* 行与行之间留一点间距 */
        }

        #sendList button {
            padding: 8px 16px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #sendList button:hover {
            background-color: #005a9e;
        }

        #sendList button:focus-visible {
            outline: 2px solid #0078d7;
            outline-offset: 2px;
        }

        /* 当前页面找不到目标元素（或页面不允许注入）时：按钮置灰、不可点击。
           真正的"不可点击"由 JS 设置 button.disabled 保证，这里只负责视觉与鼠标兜底。
           选择器必须带上 #sendList，否则特异性低于上面的 #sendList button，置灰色不生效 */
        #sendList li.disabled {
            cursor: not-allowed;
        }

        #sendList li.disabled button,
        #sendList li.disabled button:hover {
            pointer-events: none;
            background-color: #e0e0e0;
            color: #9e9e9e;
            text-decoration: none;   /* 置灰不加删除线 */
            cursor: not-allowed;
        }

        #notice {
            display: none;
            padding: 8px 10px;
            border: 1px solid #ffe0b2;
            border-radius: 4px;
            background-color: #fff4e5;
            color: #8a5300;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-line;   /* 保留提示文案里的换行 */
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="container">
        <textarea id="textInput" placeholder="请输入要发送的文本&#10;如果为空，将使用配置内容"></textarea>
        <div id="notice"></div>
        <ul id="sendList">
            <!-- 一行一个目标：按钮上显示配置名称，点击即发送 -->
            <template id="SEND_TEMPLATE">
                <li>
                    <button></button>
                </li>
            </template>
        </ul>
    </div>
    <script src="popup.js"></script>
</body>

</html>
